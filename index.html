<script>
(function(){
  const zone=document.getElementById('joyZone'), knob=document.getElementById('joyKnob'), base=document.getElementById('joyBase');
  let active=false, curX=0, curY=0, targetX=0, targetY=0, keysDown={};
  function send(code,down){
    if(down && !keysDown[code]){ window.dispatchEvent(new KeyboardEvent('keydown',{code:code})); keysDown[code]=true; }
    if(!down && keysDown[code]){ window.dispatchEvent(new KeyboardEvent('keyup',{code:code})); keysDown[code]=false; }
  }
  function loop(){
    curX += (targetX-curX)*0.22; curY += (targetY-curY)*0.22;
    knob.style.transform=`translate(${curX}px,${curY}px)`;
    send('KeyW', curY < -8); send('KeyS', curY > 8); send('KeyA', curX < -8); send('KeyD', curX > 8);
    requestAnimationFrame(loop);
  } loop();
  function move(e){ if(!active) return; e.preventDefault(); const t=e.touches?e.touches[0]:e; const r=base.getBoundingClientRect(); let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2); const max=38, len=Math.hypot(dx,dy); if(len>max){dx=dx/len*max; dy=dy/len*max;} targetX=dx; targetY=dy; }
  function end(){ active=false; targetX=0; targetY=0; send('KeyW',false); send('KeyS',false); send('KeyA',false); send('KeyD',false); }
  zone.addEventListener('touchstart',e=>{active=true; move(e);},{passive:false});
  zone.addEventListener('touchmove',move,{passive:false});
  zone.addEventListener('touchend',end); zone.addEventListener('touchcancel',end);
  // MOUSE pun boleh test joystick kat PC
  zone.addEventListener('mousedown',e=>{active=true; move({touches:[e]});});
  window.addEventListener('mousemove',e=>{ if(active) move({touches:[e]}); });
  window.addEventListener('mouseup',end);

  setInterval(()=>{
    const inLogin = !document.getElementById('register-screen')?.classList.contains('hidden');
    const inGame = !document.getElementById('hud')?.classList.contains('hidden');
    // FIX UTAMA: joystick muncul bila HUD game dah keluar, tak kira phone/PC
    zone.style.display = inGame ? 'block' : 'none';
    const logoutBtn=document.getElementById('btnLogoutFix');
    if(logoutBtn) logoutBtn.style.display = inLogin ? 'none' : 'flex';
  },300);
  document.getElementById('btnLogoutFix').addEventListener('click',()=>{
    document.getElementById('switch-account-btn')?.click();
    if(!document.getElementById('hud')?.classList.contains('hidden')){ localStorage.removeItem('umar_active_player_id'); window.location.reload(); }
  });
})();
</script>
